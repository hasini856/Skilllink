version: '3.9'

services:
  backend:
    build: ./backend
    container_name: skilllink-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: skilllink-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend